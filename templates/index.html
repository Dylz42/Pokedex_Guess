{% extends 'layout.html' %}
{% block content %}
<form method="post" class="index">
    <h1> Enter a game </h1>
    <div>
        <label>Name:</label>
        <input type="text" placeholder="Whats your name?" name="name" value="{{name}}"/>
    </div>
    <div class="join">
        <input type="text" placeholder="Room Code" name="code" value="{{code}}"/>
        <button type="submit" name="join">Join Room</button>
    </div>

    <button type="submit" name="create" class="create-btn">Create Room</button>
</form>
{% if error %}
<ul>
    <li> {{error}}</li>
</ul>
{% endif %}
{% endblock %}
