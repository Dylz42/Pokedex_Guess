{% extends 'layout.html' %}
{% block content %}
<form method="post" class="index">
    <h1> Enter a game </h1>
    <div>
        <label>Name:</label>
        <input type="text" placeholder="Whats your name?" name="name" value="{{name}}" autocomplete="off" maxlength="20" required/>
    </div>
    <div class="join">
        <input type="text" placeholder="Room Code" name="code" value="{{ code }}" maxlength="4"/>
        <button type="submit" name="join" class="join-btn">Join Room</button>
    </div>

     <div class="divider-text">OR</div>

    <button type="submit" name="create" class="create-btn">Create Room</button>
</form>
{% endblock %}
