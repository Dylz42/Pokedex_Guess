<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex Guess</title>
    <link rel="stylesheet" href="{{url_for('static', filename='/style.css')}}"/>
    <script
    src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" 
    integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" 
    crossorigin="anonymous"
    ></script>
</head>
<body>

    <header class="site-header">
        <div class="logo-container"
            <a href="{{ url_for('index') }}">
                <img
                src="{{ url_for('static', filename='images/DexGuess_Logo.png') }}"
                alt="DexGuess.io"
                class="site-logo"
                >
            </a>
            <a
            href="https://www.textstudio.com/"
            class="font-credit"
            title="Font Generator - TextStudio"
            aria-label="Font attribution"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="font-icon" aria-hidden="true">ⓕ</span>
            <span>Font generator</span>
        </a>
        </div>
    </header>

    <div class="content">
        {% block content %} {% endblock %}

        {% if error %}
        <ul>
            <li> {{error}}</li>
        </ul>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <ul>
                        {% for category, message in messages %}
                            <li class="{{ category }}">{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
        </div>
</body>
</html>
